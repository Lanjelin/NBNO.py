[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nbno"
version = "1.3.0"
description = "NB.no nedlaster"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=13,<14",
  "requests>=2.32,<3",
  "urllib3>=2,<3",
]

[project.optional-dependencies]
web = [
  "Flask>=2,<4",
  "ocrmypdf>=13.5",
  "img2pdf>=0.4",
]

[project.scripts]
nbno = "nbno:main"

[tool.setuptools]
py-modules = ["nbno"]

[tool.pyright]
venvPath = "."
venv = ".venv"
